<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Nodos – Lumina IoT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & tokens ────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:         #080e1a;
            --surface:    #0f1c2e;
            --card:       #142035;
            --border:     rgba(56, 139, 253, 0.15);
            --accent:     #3b82f6;
            --accent-glow:rgba(59, 130, 246, 0.35);
            --accent2:    #06b6d4;
            --success:    #22c55e;
            --danger:     #ef4444;
            --warn:       #f59e0b;
            --text:       #e2e8f0;
            --text-muted: #64748b;
            --font:       'Inter', system-ui, sans-serif;
            --radius:     14px;
            --radius-sm:  8px;
            --shadow:     0 8px 32px rgba(0,0,0,0.5);
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 10%, rgba(59,130,246,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 35% at 80% 90%, rgba(6,182,212,0.06) 0%, transparent 60%);
        }

        /* ── Header ────────────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }
        header h1 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #e2e8f0 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.35rem;
        }
        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ── Connection status bar ─────────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            font-size: 0.82rem;
            font-weight: 500;
        }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.4s;
        }
        .status-dot.online  { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.offline { background: var(--danger);  box-shadow: 0 0 8px var(--danger); }

        /* ── Grid de nodos ─────────────────────────────────────── */
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ── Node Card ─────────────────────────────────────────── */
        .node-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        .node-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59,130,246,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .node-card:hover {
            border-color: rgba(59,130,246,0.35);
            box-shadow: 0 8px 40px rgba(59,130,246,0.12);
        }

        .node-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.4rem;
        }
        .node-id {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .node-id-icon {
            width: 32px; height: 32px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .node-status-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
            transition: all 0.3s;
        }

        /* ── Controls ──────────────────────────────────────────── */
        .control-row {
            margin-bottom: 1.2rem;
        }
        .control-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-value {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--accent);
        }

        /* Toggle switch */
        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .toggle {
            position: relative;
            width: 50px;
            height: 27px;
            flex-shrink: 0;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-track {
            position: absolute;
            inset: 0;
            background: rgba(100,116,139,0.4);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toggle-track::after {
            content: '';
            position: absolute;
            left: 4px; top: 3px;
            width: 19px; height: 19px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .toggle input:checked + .toggle-track {
            background: var(--accent);
        }
        .toggle input:checked + .toggle-track::after {
            transform: translateX(22px);
            box-shadow: 0 0 8px var(--accent-glow);
        }
        .toggle-label-text {
            font-size: 0.88rem;
            font-weight: 500;
        }

        /* Range slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: rgba(100,116,139,0.3);
            outline: none;
            cursor: pointer;
            position: relative;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            box-shadow: 0 0 14px var(--accent-glow);
            transform: scale(1.15);
        }

        /* Light level bar */
        .light-bar-wrap {
            height: 4px;
            background: rgba(100,116,139,0.2);
            border-radius: 999px;
            margin-top: 0.5rem;
            overflow: hidden;
        }
        .light-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.3s ease;
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.2rem 0;
        }

        /* Last event indicator */
        .last-event {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .last-event-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent2);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        /* ── Event Log Panel ───────────────────────────────────── */
        .log-panel {
            max-width: 1100px;
            margin: 2rem auto 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.4rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .log-header h2 {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .log-entries {
            max-height: 280px;
            overflow-y: auto;
            padding: 0.5rem 0;
        }
        .log-entry {
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            gap: 0.75rem;
            align-items: center;
            padding: 0.55rem 1.4rem;
            border-bottom: 1px solid rgba(56,139,253,0.06);
            font-size: 0.79rem;
            animation: fadeIn 0.3s ease;
        }
        .log-entry:last-child { border-bottom: none; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
        .log-time   { color: var(--text-muted); font-family: monospace; white-space: nowrap; }
        .log-device { font-weight: 600; color: var(--accent2); white-space: nowrap; }
        .log-msg    { color: var(--text); }
        .log-badge  {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .badge-presence  { background: rgba(59,130,246,0.2); color: var(--accent); }
        .badge-light     { background: rgba(245,158,11,0.2); color: var(--warn); }
        .badge-mode      { background: rgba(139,92,246,0.2); color: #a78bfa; }
        .badge-lightlevel{ background: rgba(6,182,212,0.2);  color: var(--accent2); }
        .badge-connection{ background: rgba(34,197,94,0.2);  color: var(--success); }

        /* Scrollbar */
        .log-entries::-webkit-scrollbar { width: 4px; }
        .log-entries::-webkit-scrollbar-track { background: transparent; }
        .log-entries::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* Empty state */
        .empty-log {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Clear btn */
        .btn-sm {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover { background: rgba(59,130,246,0.1); color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

<header>
    <div class="header-badge">Lumina IoT Simulator</div>
    <h1>Panel de Nodos ESP32</h1>
    <p>Simula múltiples dispositivos IoT con MQTT · Los cambios se registran automáticamente en MongoDB</p>
</header>

<div class="status-bar">
    <div class="status-dot" id="mqtt-dot"></div>
    <span id="mqtt-label">Conectando al servidor...</span>
</div>

<div class="nodes-grid" id="nodes-grid">
    <!-- Las cards se generan dinámicamente por JS -->
</div>

<!-- Log de eventos locales del simulador -->
<div class="log-panel">
    <div class="log-header">
        <h2>📋 Log de eventos enviados al backend</h2>
        <button class="btn-sm" id="clear-log-btn">Limpiar</button>
    </div>
    <div class="log-entries" id="log-entries">
        <div class="empty-log" id="log-empty">Aún no hay eventos. Modifica algún nodo para empezar.</div>
    </div>
</div>

<script>
    // ─── Config ───────────────────────────────────────────────────────────────
    const DEVICES = ['sim-01', 'sim-02', 'sim-03'];

    // Estado local del simulador (refleja lo último enviado)
    const localState = {};
    for (const id of DEVICES) {
        localState[id] = { presence: false, lightLevel: 0 };
    }

    // ─── Utilidades ───────────────────────────────────────────────────────────
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const now = () => new Date().toLocaleTimeString('es-BO', { hour12: false });

    function badgeClass(type) {
        const map = {
            presence: 'badge-presence',
            light: 'badge-light',
            mode: 'badge-mode',
            lightLevel: 'badge-lightlevel',
            connection: 'badge-connection',
        };
        return map[type] ?? 'badge-connection';
    }

    // ─── Estado del servidor ──────────────────────────────────────────────────
    let serverOnline = false;

    async function checkServer() {
        try {
            const r = await fetch('/api/nodes-state');
            serverOnline = r.ok;
        } catch {
            serverOnline = false;
        }
        const dot = $('#mqtt-dot');
        const label = $('#mqtt-label');
        dot.className = 'status-dot ' + (serverOnline ? 'online' : 'offline');
        label.textContent = serverOnline
            ? `Servidor activo · ${DEVICES.length} nodos en simulación`
            : 'Sin conexión con el servidor del simulador';
    }

    setInterval(checkServer, 5000);
    checkServer();

    // ─── Log de eventos ───────────────────────────────────────────────────────
    const logContainer = $('#log-entries');
    let logCount = 0;

    function addLog(deviceId, type, value) {
        const empty = $('#log-empty');
        if (empty) empty.remove();

        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `
            <span class="log-time">${now()}</span>
            <span class="log-device">${deviceId}</span>
            <span class="log-msg">${type}: <strong>${JSON.stringify(value)}</strong></span>
            <span class="log-badge ${badgeClass(type)}">${type}</span>
        `;
        logContainer.prepend(entry);
        logCount++;
        // Máximo 60 entradas en el log local
        if (logCount > 60) logContainer.lastElementChild?.remove();
    }

    $('#clear-log-btn').addEventListener('click', () => {
        logContainer.innerHTML = '<div class="empty-log" id="log-empty">Log limpiado. Modifica algún nodo para ver eventos.</div>';
        logCount = 0;
    });

    // ─── API call ─────────────────────────────────────────────────────────────
    async function sendUpdate(deviceId, data) {
        try {
            const r = await fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, ...data }),
            });
            if (r.ok) {
                for (const [key, val] of Object.entries(data)) {
                    addLog(deviceId, key, val);
                }
            } else {
                console.error('Error al actualizar nodo:', r.statusText);
            }
        } catch (err) {
            console.error('Error de red:', err);
        }
    }

    // ─── Generar cards ────────────────────────────────────────────────────────
    const grid = $('#nodes-grid');

    const NODE_ICONS = ['💡', '🔆', '🌐'];

    for (let i = 0; i < DEVICES.length; i++) {
        const deviceId = DEVICES[i];
        const icon = NODE_ICONS[i] ?? '📡';
        const card = document.createElement('div');
        card.className = 'node-card';
        card.id = `card-${deviceId}`;
        card.innerHTML = `
            <div class="node-header">
                <div class="node-id">
                    <div class="node-id-icon">${icon}</div>
                    ${deviceId}
                </div>
                <span class="node-status-badge" id="badge-${deviceId}">ONLINE</span>
            </div>

            <!-- Presencia -->
            <div class="control-row">
                <div class="control-label">Sensor de Presencia</div>
                <div class="toggle-wrap">
                    <label class="toggle">
                        <input type="checkbox" id="presence-${deviceId}">
                        <span class="toggle-track"></span>
                    </label>
                    <span class="toggle-label-text" id="presence-label-${deviceId}">Sin presencia</span>
                </div>
            </div>

            <!-- Nivel de luz -->
            <div class="control-row">
                <div class="control-label">
                    Nivel de Luz Ambiental
                    <span class="control-value" id="light-val-${deviceId}">0 lux</span>
                </div>
                <input type="range" id="light-${deviceId}" min="0" max="100" value="0">
                <div class="light-bar-wrap">
                    <div class="light-bar-fill" id="light-bar-${deviceId}" style="width:0%"></div>
                </div>
            </div>

            <hr class="divider">
            <div class="last-event" id="last-evt-${deviceId}">
                <div class="last-event-dot"></div>
                <span>Esperando cambio de estado...</span>
            </div>
        `;
        grid.appendChild(card);

        // ── Evento: presencia ──────────────────────────────────────────────
        const presenceInput = $(`#presence-${deviceId}`);
        const presenceLabel = $(`#presence-label-${deviceId}`);
        presenceInput.addEventListener('change', async (e) => {
            const val = e.target.checked;
            localState[deviceId].presence = val;
            presenceLabel.textContent = val ? 'Presencia detectada' : 'Sin presencia';
            await sendUpdate(deviceId, { presence: val });
            updateLastEvent(deviceId, `Presencia → ${val ? 'true' : 'false'}`);
        });

        // ── Evento: nivel de luz ───────────────────────────────────────────
        const lightInput  = $(`#light-${deviceId}`);
        const lightVal    = $(`#light-val-${deviceId}`);
        const lightBar    = $(`#light-bar-${deviceId}`);

        // Usar 'change' (mouseup) en vez de 'input' para no saturar el servidor
        // mientras el usuario arrastra el slider
        lightInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            lightVal.textContent = `${val} lux`;
            lightBar.style.width = `${val}%`;
        });

        lightInput.addEventListener('change', async (e) => {
            const val = parseInt(e.target.value, 10);
            await sendUpdate(deviceId, { lightLevel: val });
            updateLastEvent(deviceId, `Luz → ${val} lux`);
        });
    }

    function updateLastEvent(deviceId, text) {
        const el = $(`#last-evt-${deviceId} span`);
        if (el) el.textContent = `${now()} · ${text}`;
    }
</script>
</body>
</html>
