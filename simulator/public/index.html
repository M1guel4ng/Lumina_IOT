<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador – Lumina IoT</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Manrope', system-ui, sans-serif;
            background: #f7f9fc;
            color: #0a214d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 64px;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0a214d;
            margin-bottom: 4px;
        }

        header p {
            font-size: 13px;
            color: #9eb5d2;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 820px;
            margin-bottom: 16px;
        }

        /* Card */
        .card {
            background: #fff;
            border: 1px solid #e2e9f2;
            border-radius: 12px;
            padding: 22px 24px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            color: #0a214d;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f4f9;
        }

        /* Control */
        .ctrl { margin-bottom: 18px; }
        .ctrl:last-child { margin-bottom: 0; }

        .label {
            font-size: 11px;
            font-weight: 700;
            color: #9eb5d2;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label span { color: #1679ef; font-size: 12px; text-transform: none; letter-spacing: 0; }

        /* Toggle */
        .toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
        .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
        .track {
            position: absolute;
            inset: 0;
            background: #e2e9f2;
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s;
        }
        .track::after {
            content: '';
            position: absolute;
            left: 3px; top: 3px;
            width: 16px; height: 16px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.18);
            transition: transform .2s;
        }
        .toggle input:checked + .track { background: #1679ef; }
        .toggle input:checked + .track::after { transform: translateX(18px); }
        .toggle.toggle-light input:checked + .track { background: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

        /* Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: #e2e9f2;
            outline: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #1679ef;
            cursor: pointer;
        }

        /* Log */
        .log {
            width: 100%;
            max-width: 820px;
            background: #fff;
            border: 1px solid #e2e9f2;
            border-radius: 12px;
            overflow: hidden;
        }

        .log-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 20px;
            border-bottom: 1px solid #f0f4f9;
        }

        .log-head p {
            font-size: 11px;
            font-weight: 700;
            color: #9eb5d2;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .btn-clr {
            font: inherit;
            font-size: 11px;
            color: #c8d5e5;
            background: none;
            border: none;
            cursor: pointer;
        }
        .btn-clr:hover { color: #9eb5d2; }

        .log-body { max-height: 160px; overflow-y: auto; }
        .log-body::-webkit-scrollbar { width: 3px; }
        .log-body::-webkit-scrollbar-thumb { background: #e2e9f2; border-radius: 2px; }

        .log-row {
            display: flex;
            gap: 14px;
            padding: 8px 20px;
            border-bottom: 1px solid #f7f9fc;
            font-size: 12px;
            color: #6880a6;
            animation: fadein .2s;
        }
        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
        .log-row:last-child { border-bottom: none; }
        .log-id { font-weight: 700; color: #1679ef; width: 52px; flex-shrink: 0; }
        .log-t  { color: #c8d5e5; flex-shrink: 0; }

        .log-empty {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #c8d5e5;
        }
    </style>
</head>
<body>

<header>
    <h1>Simulador de Nodos</h1>
    <p>Lumina IoT — ESP32</p>
</header>

<div class="grid" id="grid"></div>

<div class="log">
    <div class="log-head">
        <p>Registro</p>
        <button class="btn-clr" id="clr">limpiar</button>
    </div>
    <div class="log-body" id="log-body">
        <p class="log-empty" id="log-empty">Sin eventos.</p>
    </div>
</div>

<script>
    const DEVICES = ['sim-01', 'sim-02', 'sim-03'];
    const ts = () => new Date().toLocaleTimeString('es-BO', { hour12: false });
    let n = 0;

    function log(id, type, val) {
        document.getElementById('log-empty')?.remove();
        const row = document.createElement('div');
        row.className = 'log-row';
        row.innerHTML = `
            <span class="log-t">${ts()}</span>
            <span class="log-id">${id}</span>
            <span>${type}: <b>${JSON.stringify(val)}</b></span>`;
        document.getElementById('log-body').prepend(row);
        if (++n > 40) document.getElementById('log-body').lastElementChild?.remove();
    }

    document.getElementById('clr').onclick = () => {
        document.getElementById('log-body').innerHTML = '<p class="log-empty" id="log-empty">Sin eventos.</p>';
        n = 0;
    };

    async function send(deviceId, data) {
        try {
            const r = await fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId, ...data }),
            });
            if (r.ok) Object.entries(data).forEach(([k, v]) => log(deviceId, k, v));
        } catch {}
    }

    const grid = document.getElementById('grid');

    DEVICES.forEach(id => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-title">${id}</div>

            <div class="ctrl">
                <div class="label">
                    Luz (Foco)
                    <span id="txt-light-${id}">Apagado</span>
                </div>
                <label class="toggle toggle-light">
                    <input type="checkbox" id="light-${id}">
                    <span class="track"></span>
                </label>
            </div>

            <div class="ctrl">
                <div class="label">Presencia</div>
                <label class="toggle">
                    <input type="checkbox" id="p-${id}">
                    <span class="track"></span>
                </label>
            </div>

            <div class="ctrl">
                <div class="label">
                    Nivel de luz
                    <span id="v-${id}">0</span>
                </div>
                <input type="range" id="l-${id}" min="0" max="100" value="0">
            </div>
        `;
        grid.appendChild(card);

        document.getElementById(`light-${id}`).onchange = e => {
            const state = e.target.checked ? 'on' : 'off';
            const lbl = document.getElementById(`txt-light-${id}`);
            if (lbl) {
                lbl.textContent = e.target.checked ? 'Encendido' : 'Apagado';
                lbl.style.color = e.target.checked ? '#f59e0b' : '#9eb5d2';
            }
            send(id, { light: state });
        };

        document.getElementById(`p-${id}`).onchange = e =>
            send(id, { presence: e.target.checked });

        document.getElementById(`l-${id}`).oninput = e =>
            document.getElementById(`v-${id}`).textContent = e.target.value;

        document.getElementById(`l-${id}`).onchange = e =>
            send(id, { lightLevel: parseInt(e.target.value) });
    });

    // Sincronizar estado con el servidor (para reflejar comandos recibidos vía MQTT desde el dashboard)
    async function syncState() {
        try {
            const r = await fetch('/api/nodes-state');
            if (!r.ok) return;
            const data = await r.json();
            for (const n of data.nodes) {
                const lightChk = document.getElementById(`light-${n.deviceId}`);
                const lightLbl = document.getElementById(`txt-light-${n.deviceId}`);
                if (lightChk && document.activeElement !== lightChk) {
                    const isOn = n.light === 'on';
                    lightChk.checked = isOn;
                    if (lightLbl) {
                        lightLbl.textContent = isOn ? 'Encendido' : 'Apagado';
                        lightLbl.style.color = isOn ? '#f59e0b' : '#9eb5d2';
                    }
                }
                const pChk = document.getElementById(`p-${n.deviceId}`);
                if (pChk && document.activeElement !== pChk) {
                    pChk.checked = Boolean(n.presence);
                }
                const lSlider = document.getElementById(`l-${n.deviceId}`);
                const lVal = document.getElementById(`v-${n.deviceId}`);
                if (lSlider && document.activeElement !== lSlider && n.lightLevel !== undefined) {
                    lSlider.value = n.lightLevel;
                    if (lVal) lVal.textContent = n.lightLevel;
                }
            }
        } catch {}
    }
    syncState();
    setInterval(syncState, 1500);
</script>
</body>
</html>
